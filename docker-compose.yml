version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clearsight-backend
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - FRONTEND_URL=http://localhost:3000
      - BACKEND_URL=http://localhost:4000
      - RING_API_BASE_URL=https://api.amazonvision.com
      - RING_PARTNER_CLIENT_ID=${RING_PARTNER_CLIENT_ID:-mock-client-id}
      - RING_PARTNER_CLIENT_SECRET=${RING_PARTNER_CLIENT_SECRET:-mock-client-secret}
      - RING_WEBHOOK_SECRET=${RING_WEBHOOK_SECRET:-clearsight_hmac_secret_test_key_99214}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: clearsight-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:4000
      - NEXT_PUBLIC_WS_URL=ws://localhost:4000/ws
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: clearsight-network
